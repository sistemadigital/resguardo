<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exportar Firestore a JSON · Control y Causas (solo lectura)</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<style>
  body{font-family:system-ui,Arial,sans-serif;max-width:760px;margin:30px auto;padding:0 16px;color:#222}
  h1{font-size:1.4rem}
  .aviso{background:#e8f5e9;border:1px solid #2e7d32;padding:10px 14px;border-radius:6px;font-size:.92rem}
  .fuente{border:1px solid #ccc;border-radius:6px;padding:10px 14px;margin:10px 0;display:flex;align-items:center;gap:10px;cursor:pointer}
  .fuente small{color:#666;display:block}
  .acciones{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{padding:10px 18px;font-size:1rem;border:0;border-radius:6px;background:#1565c0;color:#fff;cursor:pointer}
  button.sec{background:#fff;color:#1565c0;border:1px solid #1565c0}
  button:disabled{background:#999;color:#fff;border-color:#999;cursor:wait}
  #log{background:#111;color:#9f9;padding:12px;border-radius:6px;font-family:monospace;font-size:.85rem;min-height:90px;white-space:pre-wrap;margin-top:14px}
</style>
</head>
<body>
<h1>Exportar registros de Firestore a JSON</h1>
<div class="aviso">
  <b>Solo lectura:</b> este script únicamente usa <code>.get()</code>. No ejecuta
  <code>add</code>, <code>set</code>, <code>update</code> ni <code>delete</code>, por lo que
  no modifica ni elimina nada en Firebase. Los archivos se descargan en tu PC.
</div>

<div id="lista"></div>
<div class="acciones">
  <button id="btn">Exportar seleccionadas</button>
  <button id="btnTodas" class="sec" type="button">Marcar / desmarcar todas</button>
</div>
<div id="log">Listo. Seleccioná las colecciones y presioná "Exportar".</div>

<script>
// Configuraciones tomadas de control.html y causas.html
const CONFIGS = {
  historica: {
    apiKey: "AIzaSyBt6X0u0BpiNPcV2SNPrN-spCmjl2AhZaA",
    authDomain: "causas-defensoria.firebaseapp.com",
    databaseURL: "https://causas-defensoria-default-rtdb.firebaseio.com",
    projectId: "causas-defensoria",
    storageBucket: "causas-defensoria.firebasestorage.app",
    messagingSenderId: "186064671470",
    appId: "1:186064671470:web:b58bae5eadbe6e469f19ff"
  },
  nueva: {
    apiKey: "AIzaSyBevCwkh4iOWVqhp3gG2ae1eCUMkFpnr6I",
    authDomain: "causas-2defensoria.firebaseapp.com",
    projectId: "causas-2defensoria",
    storageBucket: "causas-2defensoria.firebasestorage.app",
    messagingSenderId: "663905632804",
    appId: "1:663905632804:web:4f686a88004dc642ad0eb1"
  },
  control: {
    apiKey: "AIzaSyDJZiGAhByx5zCIVg79fIMlzE1njuauW3k",
    authDomain: "secretarios-def.firebaseapp.com",
    projectId: "secretarios-def",
    storageBucket: "secretarios-def.firebasestorage.app",
    messagingSenderId: "533584198983",
    appId: "1:533584198983:web:f51f57146ed16c813ca062"
  }
};

// Colecciones a exportar (usadas por control.html y causas.html)
const FUENTES = [
  { app: "control",   coleccion: "causas",    archivo: "secretarios-def_causas",     desc: "Base de control (secretarios-def) → causas  [control.html]" },
  { app: "control",   coleccion: "miscausas", archivo: "secretarios-def_miscausas",  desc: "Base de control (secretarios-def) → miscausas  [causas.html]" },
  { app: "historica", coleccion: "causas",    archivo: "causas-defensoria_causas",   desc: "Base histórica de expedientes (causas-defensoria) → causas" },
  { app: "nueva",     coleccion: "causas",    archivo: "causas-2defensoria_causas",  desc: "Base nueva de expedientes (causas-2defensoria) → causas" }
];

const apps = {};
for (const k in CONFIGS) apps[k] = firebase.initializeApp(CONFIGS[k], k);
const dbs = {};
for (const k in apps) dbs[k] = firebase.firestore(apps[k]);

// Render lista
const lista = document.getElementById("lista");
FUENTES.forEach((f, i) => {
  lista.insertAdjacentHTML("beforeend",
    `<label class="fuente"><input type="checkbox" id="chk${i}" checked>
     <span>${f.desc}<small>${CONFIGS[f.app].projectId} / ${f.coleccion}</small></span></label>`);
});

document.getElementById("btnTodas").addEventListener("click", () => {
  const checks = FUENTES.map((_, i) => document.getElementById("chk" + i));
  const marcar = checks.some(c => !c.checked);
  checks.forEach(c => { c.checked = marcar; });
});

const logEl = document.getElementById("log");
const log = m => { logEl.textContent += "\n" + m; logEl.scrollTop = logEl.scrollHeight; };

// Convierte tipos especiales de Firestore a JSON serializable
function convertir(v) {
  if (v === null || v === undefined) return v;
  if (typeof v.toDate === "function" && v.seconds !== undefined) return v.toDate().toISOString(); // Timestamp
  if (v instanceof firebase.firestore.GeoPoint) return { latitude: v.latitude, longitude: v.longitude };
  if (v instanceof firebase.firestore.DocumentReference) return { __ref: v.path };
  if (Array.isArray(v)) return v.map(convertir);
  if (typeof v === "object") {
    const o = {};
    for (const k in v) o[k] = convertir(v[k]);
    return o;
  }
  return v;
}

function descargar(nombre, datos) {
  const blob = new Blob([JSON.stringify(datos, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

document.getElementById("btn").addEventListener("click", async () => {
  const btn = document.getElementById("btn");
  btn.disabled = true;
  const fecha = new Date().toISOString().slice(0, 10);
  let seleccionadas = 0;
  for (let i = 0; i < FUENTES.length; i++) {
    if (!document.getElementById("chk" + i).checked) continue;
    seleccionadas++;
    const f = FUENTES[i];
    try {
      log(`Leyendo ${CONFIGS[f.app].projectId}/${f.coleccion} ...`);
      const snap = await dbs[f.app].collection(f.coleccion).get(); // SOLO LECTURA
      const datos = snap.docs.map(d => ({ id: d.id, ...convertir(d.data()) }));
      descargar(`${f.archivo}_${fecha}.json`, datos);
      log(`  ✔ ${datos.length} registros exportados → ${f.archivo}_${fecha}.json`);
      await new Promise(r => setTimeout(r, 600)); // evita bloqueo de descargas múltiples
    } catch (e) {
      log(`  ✘ Error en ${f.coleccion}: ${e.message}`);
    }
  }
  if (!seleccionadas) log("No hay colecciones seleccionadas.");
  else log("Proceso terminado. No se modificó nada en Firebase.");
  btn.disabled = false;
});
</script>
</body>
</html>
